<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor - CUBE TOUCH</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="navbar-container"></div>

    <div class="content">
        <!-- Device Info -->
        <div class="device-info-banner">
            <p class="device-info-display">⚠️ Chưa chọn thiết bị</p>
        </div>

        <!-- Metric Cards Row -->
        <div class="grid-4">
            <div class="metric-card" style="--card-color: #3498db;">
                <div class="metric-header">📱 RAW TOUCH</div>
                <div class="metric-value" id="raw-touch-value">N/A</div>
            </div>
            <div class="metric-card" style="--card-color: #e74c3c;">
                <div class="metric-header">📈 VALUE</div>
                <div class="metric-value" id="value-value">N/A</div>
            </div>
            <div class="metric-card" style="--card-color: #f39c12;">
                <div class="metric-header">🎯 THRESHOLD</div>
                <div class="metric-value" id="threshold-value">N/A</div>
            </div>
            <div class="metric-card" style="--card-color: #9b59b6;">
                <div class="metric-header">⚙️ CONTROL</div>
                <div class="metric-control">
                    <label>Ngưỡng:</label>
                    <div class="input-group">
                        <input type="text" value="43202" placeholder="Nhập ngưỡng" id="threshold-input">
                        <button class="btn btn-purple" onclick="sendThreshold()">Gửi</button>
                    </div>
                    <p class="status-text" id="threshold-status">Chưa gửi ngưỡng</p>
                </div>
            </div>
        </div>

        <!-- IR Sensor Monitoring -->
        <div class="card">
            <div class="card-header" style="background-color: #27ae60;">
                <h2>📡 IR SENSOR MONITORING</h2>
            </div>
            <div class="card-content">
                <div style="display: grid; grid-template-columns: 300px 1fr; gap: 20px;">
                    <div>
                        <div class="status-panel">
                            <h3>📥 IR Receiver</h3>
                            <p class="status-text" id="ir-status">🔴 Receiver: Waiting...</p>
                            <p id="ir-signal">Signal: 0.0V</p>
                            <div style="margin-top: 15px; padding: 10px; background: rgba(52, 152, 219, 0.1); border-radius: 8px;">
                                <p style="color: #3498db; font-weight: bold; margin-bottom: 8px;">📊 IR_ADC_1:</p>
                                <p style="font-size: 24px; font-weight: bold; color: #3498db;" id="ir-adc-1-display">0</p>
                            </div>
                            <div style="margin-top: 10px; padding: 10px; background: rgba(231, 76, 60, 0.1); border-radius: 8px;">
                                <p style="color: #e74c3c; font-weight: bold; margin-bottom: 8px;">📊 IR_ADC_2:</p>
                                <p style="font-size: 24px; font-weight: bold; color: #e74c3c;" id="ir-adc-2-display">0</p>
                            </div>
                            
                            <!-- Face Status -->
                            <div style="margin-top: 15px; padding: 12px; background: linear-gradient(135deg, rgba(155, 89, 182, 0.15), rgba(142, 68, 173, 0.1)); border-radius: 8px; border: 2px solid rgba(155, 89, 182, 0.3);">
                                <p style="color: #9b59b6; font-weight: bold; margin-bottom: 8px;">🎭 FACE Status:</p>
                                <div id="face-status-display" style="display: flex; align-items: center; gap: 8px;">
                                    <span style="font-size: 20px;">⚪</span>
                                    <span style="font-size: 18px; font-weight: bold; color: #7f8c8d;">NONE</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="graph-panel">
                        <h3>📊 IR ADC Graph (0-4095)</h3>
                        <canvas id="adc-chart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Custom Command -->
        <div class="card">
            <div class="card-header" style="background-color: #e74c3c;">
                <h2>💻 CUSTOM COMMAND</h2>
            </div>
            <div class="card-content">
                <div class="command-input">
                    <label>Command:</label>
                    <input type="text" placeholder="What do u want?" id="custom-command">
                    <button class="btn btn-danger" onclick="sendCustomCommand()">📤 Send</button>
                </div>
                <p class="status-text" id="command-status">Chưa gửi command</p>
            </div>
        </div>
    </div>

    <script src="navbar.js"></script>
    <script src="control.js"></script>
    <script>
        // Chart setup
        const ctx = document.getElementById('adc-chart').getContext('2d');
        const adcChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: []
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        max: 4095
                    },
                    x: {
                        display: false
                    }
                },
                plugins: {
                    legend: {
                        display: true,
                        position: 'top'
                    }
                },
                animation: false
            }
        });

        // Update touch data
        function updateTouchData() {
            const deviceKey = localStorage.getItem('selected_device_key');
            const url = deviceKey ? `/api/touch-data?device=${encodeURIComponent(deviceKey)}` : '/api/touch-data';
            
            console.log('[Touch] Requesting:', url, 'Device:', deviceKey);
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    console.log('[Touch] Received:', data);
                    document.getElementById('raw-touch-value').textContent = data.raw_touch;
                    document.getElementById('value-value').textContent = data.value;
                    document.getElementById('threshold-value').textContent = data.threshold;
                })
                .catch(error => console.error('Error fetching touch data:', error));
        }

        // Update IR ADC data
        function updateIRADC() {
            const deviceKey = localStorage.getItem('selected_device_key');
            const url = deviceKey ? `/api/ir-adc?device=${encodeURIComponent(deviceKey)}` : '/api/ir-adc';
            
            console.log('[IR_ADC] Requesting:', url, 'Device:', deviceKey);
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    console.log('[IR_ADC] Received:', data);
                    
                    // Update both channel displays
                    const adc1Value = data.ir_adc_1?.value || 0;
                    const adc2Value = data.ir_adc_2?.value || 0;
                    
                    document.getElementById('ir-adc-1-display').textContent = adc1Value;
                    document.getElementById('ir-adc-2-display').textContent = adc2Value;
                    
                    // Update FACE status
                    updateFaceStatus(data.face_1 || 'NONE');
                    
                    // Update status based on either channel being active
                    if (adc1Value > 0 || adc2Value > 0) {
                        document.getElementById('ir-status').textContent = '🟢 Receiver: ACTIVE';
                        document.getElementById('ir-status').style.color = '#27ae60';
                        
                        // Calculate voltage (0-4095 = 0-3.3V)
                        const voltage = ((adc1Value + adc2Value) / 2 / 4095 * 3.3).toFixed(2);
                        document.getElementById('ir-signal').textContent = `Signal: ${voltage}V (Avg)`;
                    } else {
                        document.getElementById('ir-status').textContent = '🔴 Receiver: Waiting...';
                        document.getElementById('ir-status').style.color = '#e74c3c';
                        document.getElementById('ir-signal').textContent = 'Signal: 0.0V';
                    }
                    
                    // Update chart with all channels
                    const colors = [
                        {border: '#3498db', bg: 'rgba(52, 152, 219, 0.1)'},
                        {border: '#e74c3c', bg: 'rgba(231, 76, 60, 0.1)'},
                        {border: '#2ecc71', bg: 'rgba(46, 204, 113, 0.1)'},
                        {border: '#f39c12', bg: 'rgba(243, 156, 18, 0.1)'},
                        {border: '#9b59b6', bg: 'rgba(155, 89, 182, 0.1)'}
                    ];
                    
                    const datasets = [];
                    let maxLength = 0;
                    let colorIndex = 0;
                    
                    // Build datasets for each IR_ADC channel
                    for (const key in data) {
                        if (key.startsWith('ir_adc_') && data[key].history && data[key].history.length > 0) {
                            const channelNum = key.split('_')[2];
                            const color = colors[colorIndex % colors.length];
                            
                            datasets.push({
                                label: `IR_ADC_${channelNum}`,
                                data: data[key].history,
                                borderColor: color.border,
                                backgroundColor: color.bg,
                                borderWidth: 2,
                                tension: 0.4,
                                pointRadius: 1
                            });
                            
                            if (data[key].history.length > maxLength) {
                                maxLength = data[key].history.length;
                            }
                            
                            colorIndex++;
                        }
                    }
                    
                    if (datasets.length > 0) {
                        console.log('[IR_ADC] Updating chart with', datasets.length, 'channels,', maxLength, 'points');
                        adcChart.data.labels = Array.from({length: maxLength}, (_, i) => i);
                        adcChart.data.datasets = datasets;
                        adcChart.update('none');
                    } else {
                        console.warn('[IR_ADC] No history data available');
                    }
                })
                .catch(error => console.error('Error fetching IR ADC:', error));
        }

        // Update FACE status display
        function updateFaceStatus(status) {
            const faceDisplay = document.getElementById('face-status-display');
            
            const statusConfig = {
                'TOUCH': { emoji: '👆', color: '#e74c3c', text: 'TOUCH' },
                'UP': { emoji: '⬆️', color: '#3498db', text: 'UP' },
                'DOWN': { emoji: '⬇️', color: '#f39c12', text: 'DOWN' },
                'NONE': { emoji: '⚪', color: '#7f8c8d', text: 'NONE' }
            };
            
            const config = statusConfig[status] || statusConfig['NONE'];
            
            faceDisplay.innerHTML = `
                <span style="font-size: 20px;">${config.emoji}</span>
                <span style="font-size: 18px; font-weight: bold; color: ${config.color};">${config.text}</span>
            `;
        }

        // Update device info banner
        function updateDeviceInfo() {
            const deviceIp = localStorage.getItem('selected_esp_ip');
            const devicePort = localStorage.getItem('selected_esp_port');
            const deviceKey = localStorage.getItem('selected_device_key');
            
            const banner = document.querySelector('.device-info-display');
            if (deviceIp && devicePort) {
                banner.textContent = `📡 Monitoring: ${deviceIp}:${devicePort} (${deviceKey || 'Unknown'})`;
                banner.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
            } else {
                banner.textContent = '⚠️ Chưa chọn thiết bị - Vui lòng vào Home và click Access';
                banner.style.background = 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)';
            }
        }

        // Update every 500ms
        setInterval(updateTouchData, 500);
        setInterval(updateIRADC, 500);

        // Initial update
        updateDeviceInfo();
        updateTouchData();
        updateIRADC();
    </script>
</body>
</html>
