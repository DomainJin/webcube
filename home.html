<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home - CUBE TOUCH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="navbar-container"></div>

    <div class="content">
        <!-- Welcome Card -->
        <div class="card">
            <div class="card-header" style="background-color: #3498db;">
                <h2>🏠 CUBE TOUCH SYSTEM DASHBOARD</h2>
            </div>
        </div>

        <!-- ESP Devices Status Card -->
        <div class="card">
            <div class="card-header" style="background-color: #27ae60;">
                <h2 id="esp-count">📡 ESP32 DEVICES STATUS (0 Online / 0 Total)</h2>
            </div>
            <div class="card-content">
                <div id="esp-devices-list">
                    <p class="empty-state">⏳ Waiting for ESP32 devices...<br>Devices will appear here when they send heartbeat signals.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="navbar.js"></script>
    <script>
        // Fetch ESP devices status
        let devicesData = [];
        const MAX_LAYERS = 6; // Maximum number of layer slots
        
        function updateESPDevices() {
            fetch('/api/esp-devices')
                .then(response => response.json())
                .then(devices => {
                    devicesData = devices;
                    const listContainer = document.getElementById('esp-devices-list');
                    const countHeader = document.getElementById('esp-count');
                    
                    // Count online devices
                    const onlineCount = devices.filter(d => d.is_online).length;
                    countHeader.textContent = `📡 ESP32 DEVICES STATUS (${onlineCount} Online / ${devices.length} Total)`;
                    
                    // Create layer slots
                    let html = '';
                    for (let layer = 1; layer <= MAX_LAYERS; layer++) {
                        // Find device assigned to this layer
                        const device = devices.find(d => d.layer_index === layer);
                        
                        html += `
                            <div class="layer-slot" 
                                 data-layer="${layer}"
                                 ondragover="handleLayerDragOver(event)"
                                 ondrop="handleLayerDrop(event)"
                                 ondragleave="handleLayerDragLeave(event)">
                                <div class="layer-slot-header">🎬 Layer ${layer}</div>
                        `;
                        
                        if (device) {
                            // Render device card
                            const bgColor = device.is_online ? '#e8f5e8' : '#ffe6e6';
                            const statusColor = device.is_online ? '#27ae60' : '#e74c3c';
                            const statusIcon = device.is_online ? '🟢' : '🔴';
                            
                            let pingDisplay = '';
                            if (device.ping_ms > 0) {
                                pingDisplay = `<div style="color: ${device.ping_color};">${device.ping_icon} Ping: ${device.ping_ms}ms (${device.ping_status})</div>`;
                            } else {
                                pingDisplay = `<div style="color: ${device.ping_color};">${device.ping_icon} Ping: ${device.ping_status}</div>`;
                            }
                            
                            const faceConfig = {
                                'TOUCH': { emoji: '👆', color: '#e74c3c', text: 'TOUCH' },
                                'UP': { emoji: '⬆️', color: '#3498db', text: 'UP' },
                                'DOWN': { emoji: '⬇️', color: '#f39c12', text: 'DOWN' },
                                'NONE': { emoji: '⚪', color: '#95a5a6', text: 'NONE' }
                            };
                            const faceInfo = faceConfig[device.face_status] || faceConfig['NONE'];
                            const faceDisplay = `<div style="color: ${faceInfo.color};">🎭 Face: ${faceInfo.emoji} ${faceInfo.text}</div>`;
                            
                            const ipParts = device.ip.split('.');
                            const lastOctet = ipParts[3];
                            const port = lastOctet + '00';
                            
                            const accessButton = device.is_online 
                                ? `<button class="btn-access" onclick="accessDevice('${device.ip}', ${port})">🔗 Access</button>`
                                : '';
                            
                            html += `
                                <div class="device-card" 
                                     draggable="true" 
                                     data-device-key="${device.device_key}"
                                     style="background-color: ${bgColor};"
                                     ondragstart="handleDeviceDragStart(event)"
                                     ondragend="handleDeviceDragEnd(event)"
                                     ontouchstart="handleTouchStart(event)"
                                     ontouchmove="handleTouchMove(event)"
                                     ontouchend="handleTouchEnd(event)">
                                    <div class="device-status" style="background-color: ${statusColor};">
                                        <span class="status-icon">${statusIcon}</span>
                                        <span class="status-text">${device.status}</span>
                                    </div>
                                    <div class="device-name">📱 ${device.name}</div>
                                    <div class="device-ip">🌐 ${device.ip} : ${port}</div>
                                    <div class="device-stats">
                                        <div>⏰ Last: ${device.last_heartbeat}</div>
                                        <div>📊 Count: ${device.heartbeat_count}</div>
                                        <div>🕐 Uptime: ${device.uptime}</div>
                                        ${pingDisplay}
                                        ${faceDisplay}
                                    </div>
                                    ${accessButton}
                                </div>
                            `;
                        } else {
                            // Empty slot
                            html += '<div class="layer-slot-empty">Drop device here</div>';
                        }
                        
                        html += '</div>';
                    }
                    
                    listContainer.innerHTML = html;
                })
                .catch(error => {
                    console.error('Error fetching ESP devices:', error);
                });
        }
        
        // Drag and Drop handlers for layer-based system (with touch support)
        let draggedDeviceKey = null;
        let touchStartX = 0;
        let touchStartY = 0;
        let isDragging = false;
        
        function handleDeviceDragStart(e) {
            draggedDeviceKey = e.target.dataset.deviceKey;
            e.target.classList.add('dragging');
            if (e.dataTransfer) {
                e.dataTransfer.effectAllowed = 'move';
            }
        }
        
        // Touch handlers
        function handleTouchStart(e) {
            const card = e.target.closest('.device-card');
            if (!card) return;
            
            draggedDeviceKey = card.dataset.deviceKey;
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            isDragging = false;
            
            card.classList.add('dragging');
        }
        
        function handleTouchMove(e) {
            if (!draggedDeviceKey) return;
            
            const touch = e.touches[0];
            const moveX = Math.abs(touch.clientX - touchStartX);
            const moveY = Math.abs(touch.clientY - touchStartY);
            
            if (moveX > 10 || moveY > 10) {
                isDragging = true;
                e.preventDefault(); // Prevent scrolling
            }
            
            if (isDragging) {
                // Highlight layer slot under touch
                const elementUnderTouch = document.elementFromPoint(touch.clientX, touch.clientY);
                if (elementUnderTouch) {
                    let layerSlot = elementUnderTouch.closest('.layer-slot');
                    
                    // Remove all drag-over classes
                    document.querySelectorAll('.layer-slot').forEach(slot => {
                        slot.classList.remove('drag-over');
                    });
                    
                    // Add to current slot
                    if (layerSlot) {
                        layerSlot.classList.add('drag-over');
                    }
                }
            }
        }
        
        function handleTouchEnd(e) {
            if (!draggedDeviceKey || !isDragging) {
                // Reset
                draggedDeviceKey = null;
                isDragging = false;
                document.querySelectorAll('.device-card').forEach(card => {
                    card.classList.remove('dragging');
                });
                document.querySelectorAll('.layer-slot').forEach(slot => {
                    slot.classList.remove('drag-over');
                });
                return;
            }
            
            const touch = e.changedTouches[0];
            const elementUnderTouch = document.elementFromPoint(touch.clientX, touch.clientY);
            
            if (elementUnderTouch) {
                let layerSlot = elementUnderTouch.closest('.layer-slot');
                
                if (layerSlot && draggedDeviceKey) {
                    const targetLayer = parseInt(layerSlot.dataset.layer);
                    
                    // Update layer index
                    const layerMap = {};
                    layerMap[draggedDeviceKey] = targetLayer;
                    
                    // Send to server
                    fetch('/api/update-layer-indices', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ layer_map: layerMap })
                    })
                    .then(response => response.json())
                    .then(data => {
                        console.log('Layer index updated:', data);
                        updateESPDevices(); // Refresh display
                    })
                    .catch(error => {
                        console.error('Error updating layer index:', error);
                    });
                }
            }
            
            // Cleanup
            draggedDeviceKey = null;
            isDragging = false;
            document.querySelectorAll('.device-card').forEach(card => {
                card.classList.remove('dragging');
            });
            document.querySelectorAll('.layer-slot').forEach(slot => {
                slot.classList.remove('drag-over');
            });
        }
        
        function handleDeviceDragEnd(e) {
            e.target.classList.remove('dragging');
            // Remove drag-over class from all layer slots
            document.querySelectorAll('.layer-slot').forEach(slot => {
                slot.classList.remove('drag-over');
            });
        }
        
        function handleLayerDragOver(e) {
            if (e.preventDefault) {
                e.preventDefault();
            }
            e.dataTransfer.dropEffect = 'move';
            
            // Find the layer slot (might be the slot itself or a parent)
            let layerSlot = e.target;
            while (layerSlot && !layerSlot.classList.contains('layer-slot')) {
                layerSlot = layerSlot.parentElement;
            }
            if (layerSlot) {
                layerSlot.classList.add('drag-over');
            }
            return false;
        }
        
        function handleLayerDragLeave(e) {
            let layerSlot = e.target;
            while (layerSlot && !layerSlot.classList.contains('layer-slot')) {
                layerSlot = layerSlot.parentElement;
            }
            if (layerSlot && !layerSlot.contains(e.relatedTarget)) {
                layerSlot.classList.remove('drag-over');
            }
        }
        
        function handleLayerDrop(e) {
            if (e.stopPropagation) {
                e.stopPropagation();
            }
            if (e.preventDefault) {
                e.preventDefault();
            }
            
            // Find the layer slot
            let layerSlot = e.target;
            while (layerSlot && !layerSlot.classList.contains('layer-slot')) {
                layerSlot = layerSlot.parentElement;
            }
            
            if (layerSlot && draggedDeviceKey) {
                const targetLayer = parseInt(layerSlot.dataset.layer);
                
                // Update layer index for the dragged device
                const layerMap = {};
                layerMap[draggedDeviceKey] = targetLayer;
                
                // Send to server
                fetch('/api/update-layer-indices', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ layer_map: layerMap })
                })
                .then(response => response.json())
                .then(data => {
                    console.log('Layer index updated:', data);
                    updateESPDevices(); // Refresh display
                })
                .catch(error => {
                    console.error('Error updating layer index:', error);
                });
            }
            
            layerSlot.classList.remove('drag-over');
            return false;
        }
        
        // Access device function
        window.accessDevice = function(ip, port) {
            if (confirm(`Kết nối với ${ip}:${port}?\n\nESP32 sẽ nhận lệnh điều khiển trên port này.`)) {
                // Calculate device_key (name from IP)
                const lastOctet = ip.split('.').pop();
                const deviceKey = `Cube ${lastOctet}_${ip}`;
                
                // Store selected device in localStorage
                localStorage.setItem('selected_esp_ip', ip);
                localStorage.setItem('selected_esp_port', port);
                localStorage.setItem('selected_device_key', deviceKey);
                
                // Send to server
                fetch('/api/select-device', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        device_key: deviceKey
                    })
                })
                .then(response => response.json())
                .then(data => {
                    console.log('Device selected on server:', data);
                    alert(`✓ Đã kết nối với ${ip}:${port}\n\nBạn có thể điều khiển thiết bị này từ tab Config và Monitor.`);
                })
                .catch(error => {
                    console.error('Error selecting device:', error);
                    alert(`✓ Đã lưu local: ${ip}:${port}\n\nBạn có thể điều khiển thiết bị này từ tab Config và Monitor.`);
                });
            }
        }
        
        // Update every 1 second
        setInterval(updateESPDevices, 1000);
        
        // Initial update
        updateESPDevices();
    </script>
</body>
</html>
